    <!-- Early Theme Detection: Default to Dark Mode without flicker, preserve manual choice -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('lifelevel_theme');
          var theme = saved || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Preload Primary and Priority Cat Mascot Videos for Instant Playback -->
